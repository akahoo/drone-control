# .github/workflows/build-exe.yml
name: Build EXE

on:
  push:
    branches: [ main ]        # 或你使用的主分支名，比如 jules-tello-gui-144...
  release:
    types: [ published ]      # 如果你希望在发布 Release 时触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 根据你的项目需求调整版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed tello_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drone-control-windows-exe
          path: dist/tello_gui.exe
